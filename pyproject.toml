[project]
name = "pythonformula"
version = "1.3.0"
description = "Generate or update a Homebrew formula for a uv-based Python project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
pythonformula = "pythonformula.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.3.5"]
